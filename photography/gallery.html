<script src="../assets/js/base.js"></script>
<script>
  (function () {
    const items = Array.from(document.querySelectorAll('.gallery-item'));
    const box = document.getElementById('lightbox');
    const img = document.getElementById('lbImg');
    let idx = 0;
    function show(i) {
      idx = (i + items.length) % items.length;
      img.src = items[idx].dataset.full;
      img.alt = items[idx].querySelector('img').alt;
    }
    function open(i) { show(i); box.hidden = false; document.body.style.overflow = 'hidden'; }
    function close() { box.hidden = true; document.body.style.overflow = ''; items[idx].focus(); }
    items.forEach((el, i) => el.addEventListener('click', () => open(i)));
    box.querySelector('.lb-close').addEventListener('click', close);
    box.querySelector('.lb-prev').addEventListener('click', () => show(idx - 1));
    box.querySelector('.lb-next').addEventListener('click', () => show(idx + 1));
    box.addEventListener('click', (e) => { if (e.target === box) close(); });
    document.addEventListener('keydown', (e) => {
      if (box.hidden) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });
  })();
</script>
