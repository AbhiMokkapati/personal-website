<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abhi Mokkapati | Contact Me</title>
  <link rel="stylesheet" href="contact.css">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="navbar">
  <button class="hamburger" id="hamburger">☰</button>

  <div class="logo">
    <a href = "../homepage/index.html">
      <img src="/homepage/images/AM Logo.jpg" alt="Abhi Mokkapati Personal Logo">
    </a>
  </div>

  <!-- Navigation links -->
  <nav class="nav-links" id="navLinks">
    <a href="../homepage/index.html">Home</a>
    <a href="../projects/projects.html">Personal Projects</a>
    <a href="contact.html">Contact Me</a>
  </nav>

</header>

  <main class="contact-page">
    <h1>Contact Us</h1>
    <p>Have questions or want to connect? Send me a message below!</p>

    <form action="https://formspree.io/f/xqayvaev" method="POST" class="contact-form" id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="_replyto" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <!-- Confirmation Message -->
    <div id="confirmation" class="confirmation" style="display:none;">
      <p>Your message has been recieved!</p>
      <button id="sendAnother">Send Another Message</button>
    </div>

  </main>

  <footer>
    <p>&copy; Abhi Mokkapati. All rights reserved.</p>

    <div class="footer-socials">
      <a href="https://www.instagram.com/abhi.mokkapati?utm_source=qr" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.facebook.com/abhi.mokkapati26/" target="_blank" aria-label="Facebook">
        <i class="fab fa-facebook"></i>
      </a>
    </div>
  </footer>


  <script>
    const form = document.getElementById('contactForm');
    const confirmation = document.getElementById('confirmation');
    const sendAnotherBtn = document.getElementById('sendAnother');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // stop default submission

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          // Hide form and show confirmation
          form.style.display = 'none';
          confirmation.style.display = 'block';
        } else {
          console.error('Form submission failed.');
        }
      } catch (error) {
        console.error('Error submitting form:', error);
      }
    });

    // Send Another Message
    sendAnotherBtn.addEventListener('click', () => {
      form.reset();
      form.style.display = 'flex';
      confirmation.style.display = 'none';
    });
  </script>

  <script>
    document.getElementById("hamburger").addEventListener("click", function () {
        const nav = document.getElementById("navLinks");
        nav.classList.toggle("show");
    });
  </script>
  
</body>
</html>
